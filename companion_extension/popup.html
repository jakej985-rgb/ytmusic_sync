<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YTM Sync Account Linker</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #14141e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 16px;
    }
    .badge {
      font-size: 10px;
      background: #ff0000;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    p {
      color: #888;
      margin: 0 0 14px 0;
      line-height: 1.4;
      font-size: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e1e2d;
      border: 1px solid #33334d;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #ff0000;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ff0000;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: #cc0000;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .secondary-btn {
      background: transparent;
      border: 1px solid #33334d;
      color: #aaa;
      margin-top: 8px;
      font-size: 12px;
    }
    .secondary-btn:hover {
      background: #1e1e2d;
      color: #fff;
    }
    #status-msg {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      line-height: 1.4;
    }
    .success {
      background: rgba(76, 175, 80, 0.15);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }
    .error {
      background: rgba(244, 67, 54, 0.15);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }
  </style>
</head>
<body>
  <h3>
    YTM Sync Linker
    <span class="badge">PRO</span>
  </h3>
  <p>1-click authentication companion for YouTube Music Sync.</p>

  <label for="server-url">YTM Sync Server URL</label>
  <input type="url" id="server-url" placeholder="http://localhost:8080" />

  <button id="link-btn">
    <span id="btn-text">Link Account Now</span>
  </button>
  <button id="copy-headers-btn" class="secondary-btn">
    Copy Headers (Manual Fallback)
  </button>

  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
