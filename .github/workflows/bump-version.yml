name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Version (e.g. 0.0.2-beta or 0.1.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release with release assets'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: true
        default: true
        type: boolean

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bump Version in Codebase
        id: bump
        run: |
          python3 scripts/bump_version.py "${{ inputs.version }}"
          CLEAN_VER=$(echo "${{ inputs.version }}" | sed 's/^v//')
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/ytm_service/__init__.py backend/ytm_service/main.py app/pubspec.yaml backend/web_dist/version.json
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.clean_version }}"
          git push origin main
          git tag -f "v${{ steps.bump.outputs.clean_version }}"
          git push origin "refs/tags/v${{ steps.bump.outputs.clean_version }}" --force

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "v${{ steps.bump.outputs.clean_version }}" \
            docker-compose.yml \
            ytsync.yml \
            .env.example \
            --title "v${{ steps.bump.outputs.clean_version }}" \
            --notes "Release v${{ steps.bump.outputs.clean_version }} of YTM Sync." \
            $PRERELEASE_FLAG
